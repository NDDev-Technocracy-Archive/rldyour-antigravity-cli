name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  secret-scan:
    name: Secret scan
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/secret-scan.yml@d92026cf31a10a0eeaa532e1f323c7cfdfbfac5b # 0.1.29
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly — several ci-workflows reusables now default `runner` to the
      # self-hosted `amsterdam` label, so inheriting the default on a pin bump
      # would put fork PRs on trusted private infrastructure.
      runner: ubuntu-latest
      post_command: python3 scripts/scan_text_security.py
