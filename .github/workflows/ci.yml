name: source-ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  validate:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@d7a4abb010a0cc85967fa09267b100fc90412981 # v0.6.64
    with:
      hosted-runner: ubuntu-24.04
      recipe: verify
      prepare: setup
      python-version: '3.13.18'
      uv-version: '0.13.8'
      tool-assets: .github/ci-tools.json
      fetch-depth: 0
      reports: |
        pytest.xml
        coverage.xml
      artifact: dist
      artifact-name: source-archive
      timeout-minutes: 20
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@d7a4abb010a0cc85967fa09267b100fc90412981 # v0.6.64
    with:
      hosted-runner: ${{ matrix.os }}
      recipe: check-config
      python-version: '3.13.18'
      timeout-minutes: 15
  merge-stops:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@d7a4abb010a0cc85967fa09267b100fc90412981 # v0.6.64
    with:
      hosted-runner: ubuntu-24.04
  gate:
    if: always()
    needs: [validate, smoke, merge-stops]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every source and platform gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          assert all(job["result"] == "success" for job in results.values()), results
          PY
