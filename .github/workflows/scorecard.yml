name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "21 6 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  scorecard:
    name: Scorecard
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-scorecard-json.yml@d92026cf31a10a0eeaa532e1f323c7cfdfbfac5b # 0.1.29
    with:
      publish_results: false
