name: Cross-platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Cross-platform smoke
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/cross-platform-smoke.yml@d92026cf31a10a0eeaa532e1f323c7cfdfbfac5b # 0.1.29
    with:
      os_list: '["${{ matrix.os }}"]'
      command: python3 scripts/validate_gemini_config.py --strict
